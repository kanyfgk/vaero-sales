<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAERO | Shipment Tracking</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#07111d,#18314a 55%,#384b61);
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px;
}

.wrap{
  width:100%;
  max-width:520px;
  text-align:center;
}

.logo{
  font-size:42px;
  font-weight:800;
  letter-spacing:8px;
  margin-bottom:18px;
}

h1{
  font-size:42px;
  line-height:1.1;
  margin-bottom:16px;
}

p{
  color:#cbd5e1;
  font-size:16px;
  line-height:1.6;
  margin-bottom:30px;
}

.track-box{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  padding:28px;
  border-radius:24px;
  box-shadow:0 20px 60px rgba(0,0,0,.28);
  backdrop-filter:blur(12px);
}

label{
  display:block;
  text-align:left;
  font-size:13px;
  color:#d8dee8;
  margin:0 0 8px 4px;
}

input,select{
  width:100%;
  height:54px;
  border:0;
  border-radius:14px;
  padding:0 16px;
  font-size:15px;
  margin-bottom:16px;
  outline:none;
}

button{
  width:100%;
  height:56px;
  border:0;
  border-radius:14px;
  background:#e6d7b0;
  color:#101a27;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.note{
  margin-top:26px;
  color:#cbd5e1;
  font-size:14px;
  line-height:1.6;
}

.error{
  display:none;
  margin-top:14px;
  color:#ffd2d2;
  font-size:13px;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(7,17,29,.88);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:999;
}

.spinner{
  width:36px;
  height:36px;
  border:4px solid rgba(255,255,255,.25);
  border-top-color:#e6d7b0;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-bottom:16px;
}

@keyframes spin{to{transform:rotate(360deg)}}

@media(max-width:600px){
  body{padding:22px}
  .logo{font-size:34px}
  h1{font-size:36px}
  .track-box{padding:22px}
}
  button{
  transition:.2s ease;
}

button:hover{
  transform:scale(1.02);
}

button:active{
  transform:scale(.98);
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}
</style>
</head>

<body>

<div class="wrap">
  <div class="logo">VAERO</div>

  <h1 data-i18n="title">Track your atmosphere.</h1>

<p data-i18n="subtitle">
  Follow your VAERO delivery in a simple and clear way.
</p>

  <div class="track-box">
    <label for="trackingCode" data-i18n="trackingLabel">
  Tracking number
</label>

<input
  id="trackingCode"
  type="text"
  placeholder="Enter your tracking number"
  data-i18n-placeholder="trackingPlaceholder"
  autocomplete="off"
>

    <label for="carrierSelect" data-i18n="carrierLabel">
  Carrier
</label>
    <select id="carrierSelect">
      <option value="" data-i18n="carrierPlaceholder">Select a carrier</option>
      <option value="boxnow">BOX NOW</option>
      <option value="dhl">DHL</option>
      <option value="fedex">FedEx</option>
      <option value="ups">UPS</option>
      <option value="aramex">Aramex</option>
      <option value="yunexpress">YunExpress</option>
      <option value="china-post">China Post</option>
      <option value="cainiao">Cainiao</option>
      <option value="yanwen">Yanwen</option>
      <option value="4px">4PX</option>
      <option value="dpd">DPD</option>
      <option value="gls">GLS</option>
      <option value="postnl">PostNL</option>
      <option value="royal-mail">Royal Mail</option>
      <option value="ptt">PTT Kargo</option>
      <option value="other" data-i18n="otherCarrier">Other</option>
    </select>

    <button id="trackBtn" type="button" data-i18n="trackButton">
  Track shipment
</button>

    <div id="errorMsg" class="error" data-i18n="errorMessage">
  Enter a tracking number and select a carrier.
</div>
  </div>

  <div class="note" data-i18n="note">
  Every VAERO shipment is prepared with care. Tracking updates may take time depending on the carrier.
</div>
</div>

<div id="overlay" class="overlay">
  <div class="spinner"></div>
  <div data-i18n="redirecting">
  Redirecting to shipment information...
</div>
</div>

<script>
const SUPABASE_URL = "https://wpfiszzxlwkmaqcqmywa.supabase.co/rest/v1";
const SUPABASE_KEY = "sb_publishable_eTspasegbb8PbX2hEGMD5w_ggrWRuYN";

const translations = {
  en: {
    pageTitle: "VAERO | Shipment Tracking",
    title: "Track your atmosphere.",
    subtitle: "Follow your VAERO delivery in a simple and clear way.",

    trackingLabel: "Tracking number",
    trackingPlaceholder: "Enter your tracking number",

    carrierLabel: "Carrier",
    carrierPlaceholder: "Select a carrier",
    otherCarrier: "Other",

    trackButton: "Track shipment",

    errorMessage: "Enter a tracking number and select a carrier.",

    note: "Every VAERO shipment is prepared with care. Tracking updates may take time depending on the carrier.",

    redirecting: "Redirecting to shipment information..."
  },

  el: {
    pageTitle: "VAERO | Παρακολούθηση Αποστολής",
    title: "Παρακολουθήστε την ατμόσφαιρά σας.",
    subtitle: "Παρακολουθήστε την παράδοση του VAERO με απλό και ξεκάθαρο τρόπο.",

    trackingLabel: "Αριθμός παρακολούθησης",
    trackingPlaceholder: "Εισαγάγετε τον αριθμό παρακολούθησης",

    carrierLabel: "Εταιρεία μεταφοράς",
    carrierPlaceholder: "Επιλέξτε εταιρεία μεταφοράς",
    otherCarrier: "Άλλη",

    trackButton: "Παρακολούθηση αποστολής",

    errorMessage: "Εισαγάγετε έναν αριθμό παρακολούθησης και επιλέξτε εταιρεία μεταφοράς.",

    note: "Κάθε αποστολή VAERO προετοιμάζεται με προσοχή. Οι ενημερώσεις ενδέχεται να χρειαστούν χρόνο, ανάλογα με την εταιρεία μεταφοράς.",

    redirecting: "Μεταφέρεστε στις πληροφορίες αποστολής..."
  },

  tr: {
    pageTitle: "VAERO | Gönderi Takip",
    title: "Atmosferini takip et.",
    subtitle: "VAERO gönderini sade ve net bir şekilde takip et.",

    trackingLabel: "Takip numarası",
    trackingPlaceholder: "Takip numaranızı girin",

    carrierLabel: "Kargo şirketi",
    carrierPlaceholder: "Kargo şirketi seçin",
    otherCarrier: "Diğer",

    trackButton: "Gönderiyi takip et",

    errorMessage: "Takip numarası girin ve kargo şirketi seçin.",

    note: "Her VAERO gönderisi özenle hazırlanır. Takip güncellemeleri kargo şirketine göre zaman alabilir.",

    redirecting: "Gönderi bilgisine yönlendiriliyorsunuz..."
  },

  ru: {
    pageTitle: "VAERO | Отслеживание Отправления",
    title: "Отслеживайте свою атмосферу.",
    subtitle: "Следите за доставкой VAERO просто и понятно.",

    trackingLabel: "Номер отслеживания",
    trackingPlaceholder: "Введите номер отслеживания",

    carrierLabel: "Служба доставки",
    carrierPlaceholder: "Выберите службу доставки",
    otherCarrier: "Другая",

    trackButton: "Отследить отправление",

    errorMessage: "Введите номер отслеживания и выберите службу доставки.",

    note: "Каждая отправка VAERO подготавливается с особым вниманием. Обновления могут появляться с задержкой в зависимости от службы доставки.",

    redirecting: "Переход к информации об отправлении..."
  }
};

const supportedLanguages = ["en", "el", "tr", "ru"];
let currentLanguage = "en";

const trackingInput = document.getElementById("trackingCode");
const carrierSelect = document.getElementById("carrierSelect");
const trackBtn = document.getElementById("trackBtn");
const errorMsg = document.getElementById("errorMsg");
const overlay = document.getElementById("overlay");

function detectLanguage(){
  const savedLanguage = localStorage.getItem("vaero_language");

  if(savedLanguage && supportedLanguages.includes(savedLanguage)){
    return savedLanguage;
  }

  const browserLanguages = navigator.languages || [navigator.language];

  for(const browserLanguage of browserLanguages){
    const shortCode = browserLanguage.toLowerCase().split("-")[0];

    if(supportedLanguages.includes(shortCode)){
      return shortCode;
    }
  }

  return "en";
}

function applyLanguage(language){
  const selectedLanguage = supportedLanguages.includes(language)
    ? language
    : "en";

  const translation = translations[selectedLanguage];

  currentLanguage = selectedLanguage;

  document.documentElement.lang = selectedLanguage;
  document.documentElement.dir = "ltr";
  document.title = translation.pageTitle;

  document.querySelectorAll("[data-i18n]").forEach(element => {
    const key = element.dataset.i18n;

    if(translation[key]){
      element.textContent = translation[key];
    }
  });

  document.querySelectorAll("[data-i18n-placeholder]").forEach(element => {
    const key = element.dataset.i18nPlaceholder;

    if(translation[key]){
      element.placeholder = translation[key];
    }
  });
}

function sendEvent(eventName, meta = {}){
  fetch(SUPABASE_URL + "/events", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": SUPABASE_KEY,
      "Authorization": "Bearer " + SUPABASE_KEY
    },
    body: JSON.stringify({
      event_name: eventName,
      page: window.location.pathname,
      meta: {
        ...meta,
        language: currentLanguage,
        device:
          window.innerWidth <= 767
            ? "mobile"
            : window.innerWidth <= 1024
              ? "tablet"
              : "desktop",
        width: window.innerWidth
      }
    }),
    keepalive: true
  }).catch(function(){});
}

function buildTrackingUrl(carrier, code){
  const trackingNumber = encodeURIComponent(code);

  if(carrier === "boxnow"){
    return "https://boxnow.cy/track?code=" + trackingNumber;
  }

  if(carrier === "dhl"){
    return "https://www.dhl.com/global-en/home/tracking.html?tracking-id=" + trackingNumber;
  }

  if(carrier === "fedex"){
    return "https://www.fedex.com/fedextrack/?trknbr=" + trackingNumber;
  }

  if(carrier === "ups"){
    return "https://www.ups.com/track?tracknum=" + trackingNumber;
  }

  if(carrier === "aramex"){
    return "https://www.aramex.com/track/results?ShipmentNumber=" + trackingNumber;
  }

  return "https://t.17track.net/en#nums=" + trackingNumber;
}

function checkForm(){
  const code = trackingInput.value.trim();
  const carrier = carrierSelect.value;

  trackBtn.disabled = !(code && carrier);

  if(code && carrier){
    errorMsg.style.display = "none";
  }
}

function goToTracking(){
  const code = trackingInput.value.trim();
  const carrier = carrierSelect.value;

  if(!code || !carrier){
    errorMsg.style.display = "block";
    return;
  }

  errorMsg.style.display = "none";
  overlay.style.display = "flex";

  sendEvent("tracking_submit", {
    code: code,
    carrier: carrier
  });

  const targetUrl = buildTrackingUrl(carrier, code);

  setTimeout(function(){
    window.location.href = targetUrl;
  }, 600);
}

applyLanguage(detectLanguage());
checkForm();

window.addEventListener("load", function(){
  trackingInput.focus();
});

let inputStarted = false;

trackingInput.addEventListener("focus", function(){
  sendEvent("input_focus");
});

trackingInput.addEventListener("input", function(){
  checkForm();

  if(!inputStarted && trackingInput.value.trim()){
    sendEvent("input_started");
    inputStarted = true;
  }
});

carrierSelect.addEventListener("change", function(){
  checkForm();

  sendEvent("carrier_selected", {
    carrier: carrierSelect.value
  });
});

trackBtn.addEventListener("click", goToTracking);

trackingInput.addEventListener("keydown", function(event){
  if(event.key === "Enter"){
    goToTracking();
  }
});

sendEvent("page_view", {
  referrer: document.referrer
});

setTimeout(function(){
  sendEvent("time_30s");
}, 30000);
</script>

</body>
</html>
